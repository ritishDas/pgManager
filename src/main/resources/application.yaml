spring:
  application:
    name: pgManager
  datasource:
    url: ${URL}
    username: ${USERNAME}
    password: ${PASSWORD}
    hikari:
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
